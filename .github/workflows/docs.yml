name: Docs

# Builds the AsciiDoc documentation with Antora and publishes it to the gh-pages
# branch, which GitHub Pages serves at https://foadsf.github.io/freecad-nxstyle
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Antora
        run: npm ci
      - name: Generate reference pages and build the site
        run: npm run docs
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: site from"
