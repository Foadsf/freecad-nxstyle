name: CI

on:
  push:
  pull_request:

jobs:
  qt-icons:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install PySide6
      - name: Real Qt icon states, fallback and command action controls
        run: python -m unittest discover -s tests -p test_icon_theme_qt.py -v
      - name: Render icon contact sheet
        run: python tools/preview_icons.py --out icon-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview-${{ matrix.os }}
          path: icon-preview.png
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (errors only)
        run: |
          python -m pip install ruff
          ruff check --select F,E9 .
      - name: Launcher unit tests (no FreeCAD needed)
        run: python -m unittest discover -s tests -v
      - name: Ribbon definitions are valid JSON
        run: python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('NXStyle/nxstyle/resources/ribbons/*.json')]; print('ok')"
