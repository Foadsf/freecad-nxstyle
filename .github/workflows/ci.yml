name: CI

on:
  push:
  pull_request:

jobs:
  qt-interactions:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      NXSTYLE_REQUIRE_QT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: python -m pip install PySide6
      - name: Real Qt icons, command help, Finder and keyboard interactions
        run: python -m unittest discover -s tests -p '*_qt.py' -v
      - name: Render icon contact sheet
        run: python tools/preview_icons.py --out icon-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: icon-preview-${{ matrix.os }}
          path: icon-preview.png
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint (errors only)
        run: |
          python -m pip install ruff
          ruff check --select F,E9 .
      - name: Launcher unit tests (no FreeCAD needed)
        run: python -m unittest discover -s tests -v
      - name: Ribbon definitions are valid JSON
        run: python -c "import json, glob; [json.load(open(f, encoding='utf-8')) for f in glob.glob('NXStyle/nxstyle/resources/ribbons/*.json')]; print('ok')"
